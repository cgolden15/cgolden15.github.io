<!DOCTYPE html>
<html lang="en" class="h-100" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060b17">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060b17">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ebf2ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ site.author.image }}">

  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/cyber-style.css' | relative_url }}">

  <script src="{{ '/assets/js/cyber-theme.js' | relative_url }}" defer></script>
</head>
<body class="h-100 d-flex flex-column{% if page.url == '/' %} home-page{% endif %}">
  <div class="site-bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-a"></div>
    <div class="bg-glow bg-glow-b"></div>
  </div>

  <header id="site-header" class="site-header">
    <div class="container">
      <nav class="navbar navbar-expand-lg navbar-themed px-0">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">
          <span class="mono tiny">SYSTEM</span>
          <strong>Cameron G</strong>
        </a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <i class="fas fa-bars"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav ml-auto">
            <a class="nav-item nav-link {% if page.url contains '/projects' %}active{% endif %}" href="{{ '/projects/' | relative_url }}">Projects</a>
            <a class="nav-item nav-link {% if page.url contains '/blog' %}active{% endif %}" href="{{ '/blog/' | relative_url }}">Blog</a>
            <a class="nav-item nav-link {% if page.url contains '/about' %}active{% endif %}" href="{{ '/about/' | relative_url }}">About</a>
            <a class="nav-item nav-link {% if page.url contains '/resume' %}active{% endif %}" href="{{ '/resume/' | relative_url }}">Resume</a>
            <button id="theme-toggler" class="btn btn-sm btn-outline-info ml-lg-3" type="button"></button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main class="flex-shrink-0 container site-main">
    {{ content }}
  </main>

  <footer class="mt-auto py-4 text-center site-footer">
    <small class="text-muted mb-2 d-block">
      <span class="mono">signal://</span> engineered by <strong>{{ site.author.name }}</strong>
    </small>

    <div class="container-fluid justify-content-center">
      {% if site.author.email %}
      <a class="social mx-2" href="mailto:{{ site.author.email }}"><i class="fas fa-envelope fa-lg"></i></a>
      {% endif %}
      {% if site.author.github %}
      <a class="social mx-2" href="https://www.github.com/{{ site.author.github }}"><i class="fab fa-github fa-lg"></i></a>
      {% endif %}
      {% if site.author.linkedin %}
      <a class="social mx-2" href="https://www.linkedin.com/in/{{ site.author.linkedin }}"><i class="fab fa-linkedin-in fa-lg"></i></a>
      {% endif %}
    </div>
  </footer>

  <script async defer src="https://buttons.github.io/buttons.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
